[project]
name = "redcap-alert-handler"
version = "0.1.0"
description = "Processes REDCap alerts using an O365 mailbox as a durable message queue"
readme = "README.md"
authors = [
    { name = "Nate Vack", email = "njvack@wisc.edu" }
]
requires-python = ">=3.14"
dependencies = [
    "typer>=0.26",
]

[project.urls]
Homepage = "https://github.com/uwmadison-chm/redcap-alert-handler"
Issues = "https://github.com/uwmadison-chm/redcap-alert-handler/issues"

[project.scripts]
rah = "redcap_alert_handler.cli.main:main"

[dependency-groups]
dev = [
    "ruff>=0.15",
    "ty>=0.0.57",
    "pytest>=9.1",
    "pytest-xdist>=3.8",
    "rust-just>=1.55",
]

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["redcap_alert_handler"]

[tool.ty.environment]
python-version = "3.14"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
