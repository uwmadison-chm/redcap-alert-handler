[global]
mailbox = "svc-rah@example.edu"
base_folder = "rah"
token_cache_path = "/var/lib/rah/token-cache.json"
state_base_dir = "/var/lib/rah/state"
handler_timeout = "60s"
max_retries = 5
retry_backoff = "5m"
max_age = "1d"
max_workers = 2
graph_base_url = "https://graph.microsoft.com/v1.0"

[routes.consent]
handler = "redcap-alert-handler:log_message"
max_age = "3h"
template = "consent_v2"

[routes.push_alert]
handler = "redcap-alert-handler:log_message"
model = "group-assign-v3"
